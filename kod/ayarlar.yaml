# Robot yazılımı ayarları. Robot SESLİ çalışır: mikrofon konuşma başlayınca dinler (tetik: ses), Vosk tanır,
# dinleme sessizlikle biter. Mikrofon/model yoksa robot açık bir mesajla durur; mikrofonsuz denemek için
# --gelistirici (dokunma/Enter + ekrana/terminale yazma). TTS ve seri donanım gelene kadar yazı / sahte.
# Pi'de gerçek donanıma geçmek için yalnız bu dosyayı değiştirin ("Pi'de:" notlarına bakın).
# Göreli yollar kod/ klasörüne göredir.

robot:
  ad: "Lale"                     # robotun adı henüz konmadı; konunca buraya yazın

icerik:
  paket: universite               # universite | tesis | ya da bir .yaml dosyasının yolu
  esik: 3                         # eşleşme puanı bunun altındaysa "bilmiyorum" cevabı

dil:
  saglayici: kural                # kural | gemini | anthropic  (bulut için ortam değişkeninde API anahtarı gerekir)
  gemini_model: gemini-flash-latest      # Google AI Studio'daki güncel model adıyla değiştirilebilir
  anthropic_model: claude-haiku-5-5
  gecmis_tur: 6                   # sohbet hafızası: son kaç soru-cevap bulut modeline geçmiş olarak gitsin

stt:
  saglayici: vosk                 # vosk | google | klavye   (klavye yalnız geliştirici denemesi)
  vosk_model: modeller/vosk-model-small-tr-0.3
  azami_saniye: 8                 # bir soruyu en fazla kaç saniye dinlesin
  mikrofon: ""                    # sounddevice cihaz adı/numarası; boş = varsayılan

algilama:                         # konuşma algılama (robot/mikrofon.py); Pi'de eşik için: python3 -m robot.mikrofon
  esik: 500                       # RMS ses düzeyi eşiği (int16). Gürültülü ortamda büyüt, kısık seste küçült
  sessizlik_saniye: 0.8           # konuşmadan sonra bu kadar sessizlik olunca dinleme biter
  vad_duzeyi: 2                   # webrtcvad kuruluysa 0 (gevşek) - 3 (sıkı); -1 = yalnız RMS

tts:
  saglayici: piper                # yazi | pyttsx3 | piper   (Pi'de bu gece: pyttsx3 ya da piper)
  hiz: 170                        # pyttsx3 konuşma hızı (kelime/dk)
  piper_komut: piper
  piper_model: modeller/tr_TR-dfki-medium.onnx
  ses_cihazi: "plughw:CARD=vc4hdmi0,DEV=0"                  # aplay -D değeri; boş = varsayılan. Pi 5 HDMI örneği: plughw:CARD=vc4hdmi0,DEV=0

yuz:
  etkin: true                     # false ya da --yuzsuz: yalnız terminal
  genislik: 1280                  # 10,1" ekran: 1280x800
  yukseklik: 800
  tam_ekran: true                # Pi'de: true (ESC ile çıkılır)

tetik:
  saglayici: ses                  # ses (düğmesiz, varsayılan) | dokunma ("Konuşmak için dokun" alanı) | gpio (düğme) | klavye
  gpio_pin: 17                    # BCM numarası; düğme GPIO17 (fiziksel pin 11) ile GND arasına

seri:
  port: ""                        # boş = sahte seri (log). Pi'de ESP32 gelince: /dev/ttyUSB0 ya da /dev/ttyACM0
  hiz: 115200

uzaktan:                          # telefondan kumanda (robot/uzaktan; OKU_BENI.md 10. bölüm). Telefonda: http://lale.local:8080
  etkin: true                     # false: sunucu açılmaz
  port: 8080                      # yalnız yerel ağ; modemde port yönlendirme YAPMAYIN (internete açmayın)
  pin: "1234"                     # İLK İŞ değiştirin (tırnak içinde; ör. "4821"). Yanlış PIN 1 s bekletilir

jest:
  sure: 1.0                       # jest durumunda konuşmadan önce kaç saniye beklensin

bakim:                            # bakım modu (robot/bakim.py): bir kez "bakımdayım" der, mikrofon kapalı, motorlar dur
  etkin: false                    # true ya da ana.py --bakim: yeniden başlatana kadar bakımda
  dosya: bakim.txt                # bu dosya VARKEN bakımda (telefon uygulaması yazar/siler); silinince çıkar
  aralik_saniye: 1.0              # dosyaya kaç saniyede bir bakılır (beklerken de)

gunluk:
  etkin: true                     # her tur gunlukler/YYYY-MM-DD.csv dosyasına bir satır (ölçüm için)
  klasor: gunlukler               # depoya girmez (.gitignore)

konum:                            # robotun bölgesi (robot/konum; OKU_BENI.md 9. bölüm). Komut: python3 -m robot.konum nerede
  etkin: true                     # false: konum yok, hep genel tarif ve yönsüz işaret
  aralik_saniye: 2.0              # kendi 'aralik'ı olmayan kaynakların (gps, ble) okuma aralığı
  tazelik_saniye: 30              # bu kadar eski tahmin artık oy vermez (puan = ağırlık x güven x tazelik)
  son_bilinen_bolge: null         # açılıştaki bölge (ör. giris-holu); hiç taze tahmin yoksa bu korunur
  gps_duzeltme_m: 10              # odometri GPS bölge merkezinden bu kadar uzaklaşınca GPS'e çekilir
  bolgeler: konum/bolgeler.yaml   # bölge listesi, GPS çemberleri, ArUco işaretleri, BLE beaconları
  kamera:
    aygit: 0                      # Picamera2 yoksa OpenCV kamera numarası
  elle:                           # --konum <bolge> ya da konum/bolge.txt (her 5 s okunur); güven 1, eskimez
    etkin: true
    agirlik: 3.0                  # elle söylenen bölge diğer kaynakları ezer
    bolge: null
    dosya: konum/bolge.txt
  wifi:                           # Wi-Fi parmak izi; önce: python3 -m robot.konum kaydet <bolge>
    etkin: true
    agirlik: 1.0
    aralik: 15                    # tarama bağlantıyı 1-2 s kesebilir; 10 s'den kısa yapmayın
    parmak_izi: konum/parmak_izi.yaml
    azami_uzaklik: 250            # en yakın bölge bundan uzaksa "bu bina değil" (None)
  gps:                            # NMEA seri GPS modülü (gpsd gerekmez); yalnız açık alanda
    etkin: true
    agirlik: 1.0
    port: ""                      # boş = pasif. Pi'de: /dev/ttyAMA0 (UART) ya da /dev/ttyUSB1 (USB)
    hiz: 9600
  ble:                            # BLE beacon; 'pip install bleak' yoksa pasif
    etkin: true
    agirlik: 1.0
  aruco:                          # duvardaki ArUco işaretleri; kamera takılınca true
    etkin: false
    agirlik: 2.0                  # işaret görülünce bölge neredeyse kesin
    aralik: 1.0
    iyi_kenar_px: 80              # işaret kenarı bu kadar pikselse tam güven; küçükse (uzak) düşer
  gorsel:                         # kamerayla yer tanıma; önce: python3 -m robot.konum ogret <bolge>
    etkin: false                  # kamera takılınca true
    agirlik: 1.0
    aralik: 5.0
    esik: 0.75                    # kosinüs benzerliği bunun altındaysa "tanımıyorum"
  odometri:                       # ESP32 {"k":"odo",...} satırları (seri.port doluysa); bölge değil x, y, yön verir
    etkin: true
    agirlik: 0.5
    tik_tur: 1980                 # TAHMİNİ (esp32/src/motorlar.cpp ile aynı); tekerleği 10 tur çevirip ölçün
    teker_cap_m: 0.125
    iz_genislik_m: 0.426          # sol-sağ teker merkezleri arası; ÖLÇÜN
    yaw_isareti: 1                # IMU yaw'ı saat yönünde artıyorsa -1 yapın (robotu sola çevirip izle ile bakın)
