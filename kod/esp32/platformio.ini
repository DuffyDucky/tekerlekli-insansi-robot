; Tekerlekli insansı robot -- ESP32 alt denetleyici
; Derleme:  pio run            (bu klasörde)   ya da   py -3 -m platformio run -d kod/esp32
; Yükleme:  pio run -t upload
; Monitör:  pio device monitor
; Sürümler sabit: "en son" sürüm bir gün kodu bozabilir, bu yüzden hepsi numarayla yazıldı.

[env:esp32dev]
platform = espressif32@6.9.0          ; Arduino-ESP32 çekirdeği 2.0.17
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter       ; monitörde satırı yazıp Enter'a basınca gönderir
monitor_echo = yes
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0              ; çekirdek log'u kapalı: seri hat yalnız JSON taşısın
;   -DDURUM_YAYINI=1                  ; 1 s'de bir {"k":"durum",...} göndermek için baştaki ; işaretini sil
;   -DODO_YAYINI=0                    ; 10 Hz {"k":"odo",...} yayınını KAPATMAK için (varsayılan açık)
;   -DODO_ARALIK_MS=100               ; odo yayın aralığı, ms (100 = 10 Hz)
;   -DIMU_VAR=1                       ; IMU sürücüsü yazılınca (şimdilik iskelet; bkz. src/imu.h)
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    adafruit/Adafruit PWM Servo Driver Library@3.0.2
