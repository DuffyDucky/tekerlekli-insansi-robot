<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lale Montaj Rehberi</title>
<link rel="stylesheet" href="stil.css">
<script>/* hata sayacı: rehber_uret.py headless kontrolünde <html data-hata> okunur */
window.__hata=[];(function(){function k(m){window.__hata.push(String(m));document.documentElement.dataset.hata=window.__hata.join(" | ").slice(0,500);}
addEventListener("error",function(e){k(e.message||e);});addEventListener("unhandledrejection",function(e){k(e.reason);});
var ce=console.error;console.error=function(){k(Array.prototype.join.call(arguments," "));ce.apply(console,arguments);};})();</script>
</head>
<body>
<header class="ust">
  <div class="baslik"><b>Lale</b> <span>3B montaj rehberi</span> <span class="taslak">taslak</span></div>
  <div class="ilerleme" aria-label="İlerleme"><div class="cubuk"><i id="cubuk"></i></div><span id="sayac">–</span></div>
  <div class="ust-sag">
    <button class="btn ince" id="tema" title="Tema (T)">◐</button>
  </div>
</header>
<main class="duzen">
  <section class="sahne" id="sahne">
    <canvas id="tuval"></canvas>
    <svg class="isaret" id="isaret" aria-hidden="true"></svg>
    <div class="yukleniyor" id="yukleniyor">3B model yükleniyor…</div>
    <div class="sahne-ust">
      <div class="sahne-arac">
        <button class="btn ince" id="tekrar" title="Uçuşu tekrar oynat: adımın parçaları birlikte (R)">↻ <span class="yazi">uçuş</span></button>
        <button class="btn ince" id="sifirla" title="Görünümü sıfırla (V)">⌖ <span class="yazi">görünüm</span></button>
        <span class="btn ince grup" role="radiogroup" aria-label="Önceki adımların parçaları" title="Önceki adımların parçaları (O)">
          <span class="yazi">öncekiler:</span>
          <label><input type="radio" name="onceki" value="opak" checked> opak</label>
          <label><input type="radio" name="onceki" value="saydam"> saydam</label>
          <label><input type="radio" name="onceki" value="gizli"> gizli</label>
        </span>
        <button class="btn ince" id="patlat" title="Parçaları patlat ve beklet / topla (P)">⇱ <span class="yazi">patlat</span></button>
        <button class="btn ince" id="tak" title="Sıradaki panel satırını tak (Boşluk; geri al: Shift+Boşluk)">▶ <span class="yazi">tak</span></button>
        <button class="btn ince" id="mini-dugme" title="Robotun neresi: küçük görünüm (M)">▣ <span class="yazi">konum</span></button>
        <button class="btn ince" id="renk-dugme" title="Renk: gerçek parça rengi / sınıf rengi (C)">◑ <span class="yazi">gerçek renk</span></button>
        <button class="btn ince" id="isaret-dugme" title="Bağlantı elemanı yerlerini işaretle (I)">◎ <span class="yazi">işaret</span></button>
      </div>
      <div class="kare-baslik" id="kare-baslik" hidden></div>
      <div class="etiket" id="etiket" hidden></div>
    </div>
    <div class="mini" id="mini" hidden aria-label="Robotun neresi: bütün robot soluk, bu adımın parçaları turuncu">
      <div class="mini-bas"><span>Robotun neresi</span><button class="mini-x" id="mini-kapat" title="Küçük görünümü kapat (M)" aria-label="Kapat">×</button></div>
      <div class="mini-hal" id="mini-hal" hidden></div>
      <div class="mini-yer" id="mini-yer" hidden></div>
    </div>
    <div class="lejant" id="lejant"></div>
  </section>
  <aside class="panel" id="panel">
    <div class="adim-bas">
      <div class="rozetler" id="rozetler"></div>
      <h1 id="adim-baslik">–</h1>
      <p class="is" id="adim-is"></p>
      <div id="altlar"></div>
    </div>
    <div id="notlar"></div>
    <div class="kpi-satir" id="kpi"></div>
    <details open><summary>Parçalar</summary><div id="parcalar"></div></details>
    <details open><summary>Bağlantı elemanları</summary><div id="baglantilar"></div></details>
    <details open><summary>Kontrol listesi</summary><ul class="kontrol" id="kontrol"></ul></details>
    <details open><summary>Kablo kancası</summary><ul class="kablo" id="kablo"></ul></details>
    <details><summary>Erişim notu</summary><p class="not" id="erisim"></p></details>
  </aside>
</main>
<nav class="alt">
  <button class="btn" id="geri" title="Önceki adım (←)">← Geri</button>
  <select id="secim" aria-label="Adım seç"></select>
  <button class="btn ana" id="ileri" title="Sonraki adım (→)">İleri →</button>
</nav>
<script type="application/json" id="kontrol-veri"></script>
<script src="veri/rehber-veri.js"></script>
<script src="veri/robot-glb.js"></script>
<!-- three.js 0.160.0 + GLTFLoader, OrbitControls, toCreasedNormals tek klasik betikte (F10a): internetsiz ve file:// ile açılır -->
<script src="vendor/three-0.160.0-paket.min.js"></script>
<script src="app.js"></script>
<script>window.RehberBaslat(window.LALE_UC);</script>
</body>
</html>
